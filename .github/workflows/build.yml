name: Build libiec61850
on: [push]
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -DBUILD_SHARED_LIBS=ON -B build .
      - name: Build
        run: cmake --build build --config Release
      - name: Upload DLL
        uses: actions/upload-artifact@v6
        with:
          name: libiec61850-windows
          path: build/Release/libiec61850.dll

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -DBUILD_SHARED_LIBS=ON -B build .
      - name: Build
        run: cmake --build build
      - name: Upload SO
        uses: actions/upload-artifact@v6
        with:
          name: libiec61850-linux
          path: build/libiec61850.so
